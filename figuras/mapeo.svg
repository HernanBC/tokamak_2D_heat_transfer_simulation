<svg xmlns="http://www.w3.org/2000/svg"
     width="740" height="485" viewBox="0 0 740 485"
     role="img" aria-labelledby="titulo descripcion">

    <title id="titulo">Mapeo de una banda del SOL hasta su primer impacto</title>
    <desc id="descripcion">
        Corte poloidal esquemático de un tokamak con divertor inferior.
        Un punto naranja marca el lanzamiento de una banda justo afuera de la
        última superficie cerrada, en el plano medio exterior. Desde ahí se sigue
        la misma línea abierta en dos sentidos. Una rama rodea la parte superior
        del plasma y la otra baja por el lado exterior. En este ejemplo cada
        rama termina en un blanco distinto y recibe la mitad de la potencia
        asignada a la banda.
    </desc>

    <defs>
        <style>
            text { font-family: Arial, Helvetica, sans-serif; fill: #263440; }
            .nombre { font-size: 16px; font-weight: 600; }
            .detalle { font-size: 14px; }
            .nota { font-size: 13px; fill: #52626c; }
            .guia {
            fill: none; stroke: #829098; stroke-width: 1.1;
            stroke-linecap: round; stroke-linejoin: round;
            }
            .rama {
            fill: none; stroke: #af591c; stroke-width: 2.8;
            stroke-linecap: round; stroke-linejoin: round;
            }
        </style>
    </defs>

    <rect width="740" height="485" fill="white"/>

    <!-- Primera pared y divertor inferior, en corte poloidal esquemático. -->
    <path d="M104 316
          L104 123 Q105 66 130 35
          Q144 19 163 23
          C236 30 312 91 342 151
          C374 216 367 263 333 305
          Q309 335 266 359"
          fill="none" stroke="#35434e" stroke-width="2.3"
          stroke-linecap="round"/>

    <path d="M104 316 Q127 321 133 343
          L112 405 L139 399
          Q156 372 178 378
          Q195 380 205 407
          L228 431 L228 397
          Q230 370 266 359"
          fill="none" stroke="#35434e" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dominio confinado. El vértice inferior es el punto X. -->
    <path d="M164 352
          C150 322 127 275 125 218
          C122 162 123 100 141 70
          C150 56 162 55 177 59
          C233 73 291 117 319 169
          C344 216 336 258 308 289
          C278 320 211 329 164 352Z"
          fill="#edf6f5" stroke="#087c78" stroke-width="2.3"/>

    <!-- Piernas de la separatriz. La línea de lanzamiento pasa por fuera. -->
    <path d="M164 352 Q150 361 126 364
          M164 352 Q180 371 197 391"
          fill="none" stroke="#71aaa6" stroke-width="1.4"/>

    <!-- El plano medio exterior pasa por la altura del eje magnético. -->
    <path d="M232 213H392" fill="none" stroke="#8a969d"
          stroke-width="1" stroke-dasharray="5 5"/>
    <circle cx="232" cy="213" r="3" fill="#35434e"/>

    <!-- Misma línea abierta, recorrida desde el lanzamiento en dos sentidos. -->
    <path class="rama"
          d="M346 213
          C346 182 327 146 302 119
          C269 83 215 51 174 45
          C146 41 132 52 122 80
          C108 119 111 177 114 224
          C117 276 137 320 148 348
          Q150 359 137 372
          L120 381.4"/>

    <path class="rama"
          d="M346 213
          C348 249 335 280 311 302
          C284 327 228 341 188 354
          Q175 359 184 370
          Q200 384 213 396
          L228 406"/>

    <!-- Flèches placées sur les trajectoires, dans le sens du parcours. -->
    <g fill="#af591c">
        <path d="M0 0L-11 -4.5L-8 0L-11 4.5Z"
              transform="translate(263 85) rotate(216)"/>
        <path d="M0 0L-11 -4.5L-8 0L-11 4.5Z"
              transform="translate(114 224) rotate(86)"/>
        <path d="M0 0L-11 -4.5L-8 0L-11 4.5Z"
              transform="translate(311 302) rotate(138)"/>
        </g>

        <!-- Lanzamiento y primeros impactos. -->
        <circle cx="346" cy="213" r="5.8" fill="#af591c"
                stroke="white" stroke-width="1.6"/>
        <g fill="#af591c" stroke="white" stroke-width="1.3">
            <circle cx="120" cy="381.4" r="5"/>
            <circle cx="228" cy="406" r="5"/>
        </g>

        <!-- Referencias sobre el corte. -->
        <text x="228" y="189" text-anchor="middle" class="nombre">Plasma</text>
        <text x="228" y="207" text-anchor="middle" class="nota">confinado</text>

        <path class="guia" d="M63 266H91L131 263"/>
        <text x="55" y="271" text-anchor="end" class="detalle">LCFS</text>

        <path class="guia" d="M60 419H83L115 386"/>
        <text x="54" y="424" text-anchor="end" class="detalle">IVT</text>

        <path class="guia" d="M234 410L262 430H285"/>
        <text x="292" y="435" class="detalle">OVT</text>

        <!-- Explicación junto al punto de lanzamiento. -->
        <path class="guia" d="M354 209L390 175H415"/>
        <text x="426" y="171" class="nombre">Lanzamiento de una banda</text>
        <text x="426" y="193" class="detalle">En el plano medio exterior,</text>
        <text x="426" y="213" class="detalle">justo afuera de la LCFS.</text>

        <path d="M426 247H699" stroke="#d9e1e2"/>
        <text x="426" y="276" class="nombre">Dos sentidos de recorrido</text>
        <text x="426" y="299" class="detalle">Cada sentido lleva la mitad de</text>
        <text x="426" y="319" class="detalle">la potencia de esta banda hasta</text>
        <text x="426" y="339" class="detalle">su primer contacto con material.</text>

        <!-- Leyenda de los dos contornos que deben distinguirse. -->
        <path d="M426 78H454" stroke="#087c78" stroke-width="2.4"/>
        <text x="465" y="83" class="detalle">Última superficie cerrada</text>
        <path d="M426 105H454" stroke="#af591c" stroke-width="2.8"/>
        <text x="465" y="110" class="detalle">Línea abierta seleccionada</text>
    </svg>
